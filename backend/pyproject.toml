[project]
name = "confocal"
version = "0.1.0"
description = "Confocal surface scanner for the OpenFlexure microscope: hardware abstraction, scanning, signal processing, surface reconstruction and API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "sqlmodel>=0.0.22",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",
    "h5py>=3.10",
    "pyserial>=3.5",
    "joblib>=1.3",
    # ADS1115 over I2C (pure Python; installs everywhere, usable only on Linux /dev/i2c-*).
    "smbus2>=0.4.3",
]

[project.scripts]
confocal-server = "confocal.__main__:main"
confocal-hwcheck = "confocal.tools.hwcheck:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyserial>=3.5",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["confocal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: end-to-end tests through the API, ScanManager and simulated hardware",
    "slow: tests that take more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["confocal", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC", "PT", "C4", "PIE", "RET"]
ignore = [
    "B008", # FastAPI Depends()/Query() in argument defaults is idiomatic
    "N803", # scientific names such as X for feature matrices
    "N806",
]

[tool.ruff.lint.isort]
known-first-party = ["confocal"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["confocal"]

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "sklearn.*",
    "skimage.*",
    "h5py.*",
    "joblib.*",
    "serial.*",
    "adafruit_ads1x15.*",
    "board",
    "busio",
    "smbus2",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
